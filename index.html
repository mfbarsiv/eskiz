<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e6964">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eskiz Defteri">
<meta name="description" content="Tablet için eskiz defteri: kalemler, suluboya, aydınger ve yapay zekâ ile render.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Eskiz Defteri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: tam ekran çizim masası; solda fırça şeridi, altta renk ve boyut çubuğu, sağda açılır panel (kâğıt, ızgara, aydınger, kırpımlar). Kâğıt iki temada da kendi rengini korur. */
:root{
  --desk:#d9dedb; --chrome:rgba(250,252,251,.93); --chrome-solid:#fbfcfb;
  --line:#cfd8d4; --fg:#1c2421; --muted:#5d6b66; --accent:#0e6964; --accent-fg:#ffffff;
  --accent-soft:rgba(14,105,100,.12); --danger:#b0372c;
  --shadow:0 8px 28px rgba(18,36,31,.14);
  --f-ui:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-hand:"Architects Daughter","Segoe Print","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#141917; --chrome:rgba(24,30,28,.95); --chrome-solid:#1a201e;
  --line:#33403b; --fg:#e5ebe8; --muted:#97a6a0; --accent:#53b5ab; --accent-fg:#0b1513;
  --accent-soft:rgba(83,181,171,.16); --danger:#e2766b; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#141917; --chrome:rgba(24,30,28,.95); --chrome-solid:#1a201e;
  --line:#33403b; --fg:#e5ebe8; --muted:#97a6a0; --accent:#53b5ab; --accent-fg:#0b1513;
  --accent-soft:rgba(83,181,171,.16); --danger:#e2766b; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--desk);color:var(--fg);font-family:var(--f-ui);font-size:15px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{background:var(--chrome);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 10px;min-width:0;pointer-events:auto;text-align:left}
.brand .i{flex:none}
.brand b{font-family:var(--f-hand);font-weight:400;font-size:20px;line-height:1;white-space:nowrap}
.brand .chip{font-size:13px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.actions{display:flex;gap:2px;padding:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.ab{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:7px 10px;border-radius:8px;white-space:nowrap}
.ab:hover{background:var(--accent-soft)}
.ab:disabled{opacity:.35;cursor:default;background:transparent}
.ab.on{background:var(--accent);color:var(--accent-fg)}
.sep{width:1px;background:var(--line);margin:6px 4px;flex:none}
@media (max-width:960px){.ab .lb{display:none}}
@media (max-width:600px){.brand b{display:none}}
.rail{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1px;padding:5px;overflow-y:auto;scrollbar-width:none;max-height:calc(100% - 170px)}
.rail::-webkit-scrollbar{display:none}
.tb{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;border-radius:9px;padding:6px 4px;width:60px;font-size:12px;color:var(--muted);flex:none}
.tb:hover{background:var(--accent-soft);color:var(--fg)}
.tb.on{background:var(--accent);color:var(--accent-fg)}
.rsep{height:1px;background:var(--line);margin:4px 6px;flex:none}
.penbar{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 10px;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.penbar::-webkit-scrollbar{display:none}
.szw{display:flex;align-items:center;gap:8px;flex:none;font-size:13px;color:var(--muted)}
.szw input{width:120px;accent-color:var(--accent)}
.szw b{font-weight:500;color:var(--fg);min-width:30px;font-variant-numeric:tabular-nums}
.dotprev{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none}
.dotprev i{display:block;border-radius:50%}
.vsep{width:1px;align-self:stretch;background:var(--line);flex:none}
.colors{display:flex;gap:5px;flex:none;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--chrome-solid);box-shadow:0 0 0 1px var(--line);padding:0;flex:none}
.sw.on{box-shadow:0 0 0 2px var(--fg)}
.addc{position:relative;width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--muted);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;line-height:1;flex:none;overflow:hidden}
.addc input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 110px));overflow:auto;padding:14px;display:flex;flex-direction:column;gap:18px;z-index:5}
.psec{display:flex;flex-direction:column;gap:10px}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.phead h2{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.phead span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:14px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.penbar .chips button{white-space:nowrap;flex:none}
.prow{display:flex;align-items:center;gap:8px}
.prow input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.prow .lab{font-size:13.5px;color:var(--muted);min-width:74px}
.eye{border:0;background:transparent;padding:6px;border-radius:8px;color:var(--muted);display:flex}
.eye.on{color:var(--accent)}
.eye:hover{background:var(--accent-soft)}
.btn{border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 12px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.4}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
.layers{display:flex;flex-direction:column;gap:4px}
.ly{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 6px;align-items:center;border:1px solid transparent;border-radius:9px;padding:5px 6px}
.ly.act{border-color:var(--accent);background:var(--accent-soft)}
.ly .nm{font-family:var(--f-hand);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;text-align:left;padding:2px 0}
.ly .tools{display:flex;gap:0}
.ly .tools button{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:3px 5px;font-size:14px}
.ly .tools button:hover{background:var(--accent-soft);color:var(--fg)}
.ly .op{grid-column:2/4;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.ly .op input{flex:1;accent-color:var(--accent);min-width:0}
.crops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crop{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--chrome-solid);display:flex;flex-direction:column}
.crop img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#eceeea}
.crop div{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;font-size:13px}
.crop button{border:0;background:transparent;color:var(--muted);padding:2px 4px;border-radius:6px}
.ab.rbtn{background:var(--accent);color:var(--accent-fg)}
.cropbar{position:absolute;z-index:6;display:flex;gap:2px;padding:4px}
.cropbar .ok{background:var(--accent);color:var(--accent-fg)}
.rv{position:absolute;inset:0;z-index:15;background:var(--desk);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rvtop{display:flex;align-items:center;gap:6px;padding:10px 0;flex:none}
.rvtop .rvt{font-family:var(--f-hand);font-weight:400;font-size:20px;margin-right:auto;margin-left:6px}
.rvbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;padding-bottom:12px}
@media (max-width:820px){.rvbody{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 150px}}
.rvmain{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:14px;padding:2px 2px 0;scrollbar-width:thin}
.rvimg{background:var(--chrome-solid);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center;flex:none;box-shadow:var(--shadow)}
.rvimg img{max-width:100%;max-height:52vh;object-fit:contain;border-radius:6px;display:block}
.rvimg.empty{min-height:200px}
.rsec{background:var(--chrome-solid);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.rsec h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.rsec h3 b{color:var(--accent);letter-spacing:0;text-transform:none;font-size:14px}
.rsec input[type=range]{width:100%;accent-color:var(--accent)}
.rsec .crl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.rsec textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;-webkit-user-select:text;user-select:text}
.rsec.pr summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
.rsec.pr pre{white-space:pre-wrap;font-size:12.5px;line-height:1.45;margin:8px 0 0;max-height:260px;overflow:auto;-webkit-user-select:text;user-select:text}
.rvgo{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 0;background:linear-gradient(transparent,var(--desk) 30%)}
.rvgo .btn.primary{padding:10px 26px;font-size:16px;font-weight:500}
.rvgo .btn:disabled{opacity:.45}
.rvside{min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--chrome-solid);border:1px solid var(--line);border-radius:12px;padding:12px}
.rvsh{display:flex;justify-content:space-between;align-items:baseline}
.rvsh h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rvsh span{font-size:13px;color:var(--muted)}
.hist{overflow-y:auto;display:grid;grid-template-columns:1fr;gap:8px;align-content:start;min-height:0}
@media (max-width:820px){.hist{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:130px;overflow-x:auto;overflow-y:hidden}}
.hc{border:1px solid var(--line);border-radius:9px;background:var(--chrome);padding:0;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;text-align:left;min-height:90px}
.hc img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#eceeea}
.hc i{font-style:normal;font-size:12px;color:var(--muted);padding:3px 8px}
.hc small{padding:10px 8px 0;font-size:12.5px;color:var(--muted);line-height:1.3}
.hc.err small{color:var(--danger)}
.hc .spin{width:22px;height:22px;margin:16px auto 0;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rvset{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));width:min(340px,calc(100% - 32px));padding:14px;display:flex;flex-direction:column;gap:10px;z-index:3}
.rvset h3{margin:0;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rvset label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.rvset input,.rvset select{font-size:15px;color:var(--fg);background:var(--chrome-solid);border:1px solid var(--line);border-radius:8px;padding:7px 9px;-webkit-user-select:text;user-select:text}
.rvset #sGm,.rvset #sOa{display:flex;flex-direction:column;gap:10px}
.rvview{position:absolute;inset:0;z-index:4;background:rgba(10,14,12,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.rvvin{max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;padding:12px;overflow:auto}
.rvvin{width:min(1100px,100%)}
.zw{position:relative;overflow:hidden;height:min(68vh,calc(100vh - 230px));min-height:240px;border-radius:8px;background:#eceeea;touch-action:none;cursor:grab}
.zw img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
.zbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.zbar .btn{min-width:44px}.zbar b{font-weight:500;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
#zCmp.on{background:var(--accent);color:var(--accent-fg)}
.rvvmeta{display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.4}
.rvvmeta img{width:80px;border-radius:6px;border:1px solid var(--line);flex:none}
.rvvmeta small{color:var(--muted)}
.rvvin .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){.hc .spin{animation:none}}
.df{position:absolute;inset:0;z-index:16;background:var(--desk);display:flex;flex-direction:column;overflow:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.df .rvtop{position:sticky;top:0;background:var(--desk);z-index:1}
.dfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-content:start}
.pc{background:var(--chrome-solid);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pc.cur{outline:2px solid var(--accent);outline-offset:-1px}
.pc .th{display:block;width:100%;aspect-ratio:2400/1700;background:#f4f3ee;border:0;padding:0;cursor:pointer}
.pc .th img{display:block;width:100%;height:100%;object-fit:contain}
.pc .nm{display:flex;align-items:center;gap:6px;padding:8px 10px 2px}
.pc .nm input{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;font-size:15px;font-weight:500;-webkit-user-select:text;user-select:text}
.pc .nm input:focus{border-color:var(--line);background:var(--chrome)}
.pc .dt{padding:0 15px;font-size:12.5px;color:var(--muted)}
.pc .row{display:flex;gap:4px;padding:6px 8px 8px;flex-wrap:wrap}
.pc .row .btn{padding:5px 9px;font-size:13px}
.pc .row .del{margin-left:auto;color:var(--danger)}
.pc.new{align-items:center;justify-content:center;min-height:180px;border-style:dashed;box-shadow:none;background:transparent;cursor:pointer;font-size:17px;color:var(--accent);gap:6px}
.pc.new b{font-size:40px;font-weight:400;line-height:1}
.dfnote{color:var(--muted);font-size:13.5px;line-height:1.45;max-width:720px;margin:18px 2px 0}
.savepop{position:absolute;z-index:17;display:flex;flex-direction:column;gap:6px;padding:8px;min-width:190px}
.toast{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 14px;font-size:14.5px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.cursor{position:absolute;pointer-events:none;border:1px solid rgba(28,36,33,.55);border-radius:50%;z-index:3;transform:translate(-50%,-50%)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.lnw{display:flex;align-items:center;gap:10px;flex:none}.lnw[hidden]{display:none}
.lnw .chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.impbar{position:absolute;z-index:7;top:76px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:4px;max-width:calc(100% - 24px)}
.impbar .ok{background:var(--accent);color:var(--accent-fg)}
.szm{position:fixed;inset:0;background:rgba(18,36,31,.38);display:flex;align-items:center;justify-content:center;z-index:60}
.szm .card{background:var(--chrome-solid,#fff);border-radius:16px;padding:18px;max-width:440px;width:calc(100% - 32px);display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.szm h3{margin:0;font-size:17px}.szm .row{display:flex;gap:8px;justify-content:flex-end}
.szm p{margin:0;font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div id="app">
  <canvas id="cv"></canvas>
  <div class="cursor" id="cur" hidden></div>
  <header class="topbar">
    <button class="brand bar" id="bBook" title="Defteri aç: tüm sayfalar"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/></svg><b>Eskiz Defteri</b><span class="chip" id="pgName">Sayfa 1</span></button>
    <div class="actions bar">
      <button class="ab" id="bUndo" title="Geri al"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg><span class="lb">Geri</span></button>
      <button class="ab" id="bRedo" title="Yinele"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg><span class="lb">İleri</span></button>
      <span class="sep"></span>
      <button class="ab" id="bSym" title="Simetri"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2"/><path d="M9 7L4 12l5 5M15 7l5 5-5 5"/></svg><span class="lb">Simetri</span></button>
      <button class="ab" id="bFit" title="Sayfayı sığdır"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lb">Sığdır</span></button>
      <button class="ab" id="bPanel" title="Kâğıt, ızgara, aydınger"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M14 5v14"/></svg><span class="lb">Panel</span></button>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,ms=3000){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms)}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

/* ===== sayfa ve durum ===== */
let PW=2400,PH=1700;
const BR=[
 {id:'kursun',ad:'Kurşun',sz:3,ic:'<path d="M4 20l3-1 11-11-2-2L5 17z"/><path d="M14 6l2 2"/><path d="M4 20l1-3" stroke-dasharray="1 1.5"/>'},
 {id:'ince',ad:'İnce uç',sz:3,ic:'<path d="M5 19L17 7"/><path d="M15 5l4 4-2 2-4-4z"/>'},
 {id:'dolma',ad:'Dolma',sz:5,ic:'<path d="M5 19l3-7 7-7 4 4-7 7z"/><path d="M5 19l4-4"/><circle cx="11" cy="13" r="1"/>'},
 {id:'firca',ad:'Fırça',sz:12,ic:'<path d="M4 20c3 0 5-1 6-3l8-9-2-2-9 8c-2 1-3 3-3 6z"/>'},
 {id:'marker',ad:'Marker',sz:28,ic:'<path d="M6 18l2-6 8-8 4 4-8 8z"/><path d="M6 18l-2 2h5"/>'},
 {id:'sulu',ad:'Suluboya',sz:48,ic:'<path d="M12 3c3 4 6 7 6 11a6 6 0 01-12 0c0-4 3-7 6-11z"/>'},
 {id:'pastel',ad:'Pastel',sz:22,ic:'<rect x="6" y="5" width="7" height="15" rx="2" transform="rotate(25 9 12)"/><path d="M14 18h6" stroke-dasharray="1.5 2"/>'},
 {id:'golge',ad:'Gölge',sz:90,ic:'<circle cx="12" cy="12" r="7" stroke-dasharray="1.5 2"/><circle cx="12" cy="12" r="3"/>'},
 {id:'silgi',ad:'Silgi',sz:36,ic:'<path d="M8 20h12"/><path d="M5 15l8-8 5 5-6 6H8z"/>'},
 {sep:1},
 {id:'damla',ad:'Damlalık',ic:'<path d="M14 4l6 6-3 1-7 7H7v-3l7-7z"/><path d="M4 20l3-3"/>'},
 {id:'el',ad:'El',ic:'<path d="M8 12V5.5a1.5 1.5 0 013 0V11M11 11V4a1.5 1.5 0 013 0v7M14 11V6a1.5 1.5 0 013 0v7c0 4-2.5 7-6 7-2.8 0-4.4-1.6-6-4.4l-1.4-2.4a1.4 1.4 0 012.3-1.5L8 13"/>'}];
const BRUSH=Object.fromEntries(BR.filter(b=>b.id).map(b=>[b.id,b]));
const PALETTE=[['Siyah','#16181b'],['Grafit','#3a3d40'],['Sıcak gri açık','#c4bdb2'],['Sıcak gri koyu','#8a8178'],['Soğuk gri açık','#b6bdc2'],['Soğuk gri koyu','#7c858c'],['Okr','#c58b3a'],['Ahşap','#9b6b43'],['Kiremit','#b5523b'],['Zeytin','#7d8a4a'],['Gök','#6f9fc8'],['Lacivert','#2c4a7a']];
let D={paper:'eskiz',pat:'kare',patOn:true,patOp:.35,persp:0,perOn:true,perOp:.45,grid:{hy:PH*.44,v1:-PW*.55,v2:PW*1.55,c:PW/2,v3:[PW/2,PH*2.7]},sym:false,symX:PW/2,fog:.5,pw:2400,ph:1700,wob:.5,hold:600,snapA:true,autoLine:true,ruler:false,
  layers:[],active:null,seq:1,crops:[],cseq:1,mine:[],recent:[],sizes:{},ops:{},color:'#16181b',tool:'kursun',erMode:'sert',mkTip:'kesik',mkAng:35,renders:[]};

/* ===== kâğıt dokusu ===== */
function noiseTile(n,cells,seed){const g=[];let s=seed;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let i=0;i<cells*cells;i++)g.push(rnd());
  const out=new Float32Array(n*n);for(let y=0;y<n;y++)for(let x=0;x<n;x++){const fx=x/n*cells,fy=y/n*cells,ix=Math.floor(fx),iy=Math.floor(fy),u=fx-ix,v=fy-iy;const sm=t=>t*t*(3-2*t);
    const a=g[(iy%cells)*cells+ix%cells],b=g[(iy%cells)*cells+(ix+1)%cells],c=g[((iy+1)%cells)*cells+ix%cells],d=g[((iy+1)%cells)*cells+(ix+1)%cells];const su=sm(u),sv=sm(v);out[y*n+x]=a*(1-su)*(1-sv)+b*su*(1-sv)+c*(1-su)*sv+d*su*sv}return out}
const PAPERS={
  eskiz:{ad:'Eskiz kâğıdı',base:[248,247,242],oct:[[256,.45],[128,.35],[64,.2]],shade:.05,tooth:.55},
  sulu:{ad:'Suluboya kâğıdı',base:[247,243,234],oct:[[40,.3],[96,.4],[192,.3]],shade:.085,tooth:.9},
  kraft:{ad:'Kraft',base:[196,163,120],oct:[[128,.45],[256,.35],[32,.2]],shade:.16,tooth:.6,fiber:1},
  ayd:{ad:'Aydınger',base:[236,240,240],oct:[[128,.6],[64,.4]],shade:.06,tooth:.35}};
const TEX={};
function paperTex(k){if(TEX[k])return TEX[k];const P=PAPERS[k],n=512;const acc=new Float32Array(n*n);let sd=7;for(const[c,w]of P.oct){const t=noiseTile(n,c,sd+=13);for(let i=0;i<acc.length;i++)acc[i]+=t[i]*w}
  if(P.fiber){const f=noiseTile(n,256,99);for(let y=0;y<n;y++)for(let x=0;x<n;x++){acc[y*n+x]=acc[y*n+x]*.75+f[y*n+((x*3)%n)]*.25}}
  let mn=1,mx=0;for(const v of acc){if(v<mn)mn=v;if(v>mx)mx=v}const T=new Float32Array(n*n);for(let i=0;i<acc.length;i++)T[i]=(acc[i]-mn)/(mx-mn||1);
  const sh=mk(n,n),sx=sh.getContext('2d'),im=sx.createImageData(n,n);for(let i=0;i<T.length;i++){const d=(T[i]-.5)*2*P.shade*255;im.data[i*4]=clamp(P.base[0]+d,0,255);im.data[i*4+1]=clamp(P.base[1]+d,0,255);im.data[i*4+2]=clamp(P.base[2]+d*1.05,0,255);im.data[i*4+3]=255}sx.putImageData(im,0,0);
  TEX[k]={T,n,shade:sh,tooth:P.tooth,cache:{}};return TEX[k]}
/* renkli doku deseni: kurşun (yumuşak), pastel (eşikli), granül (suluboya) */
function toothPat(ctx,kind,col){const t=paperTex(D.paper),key=kind+col;if(t.cache[key])return t.cache[key];const n=t.n,c=mk(n,n),x=c.getContext('2d'),im=x.createImageData(n,n);const[r,g,b]=hex2rgb(col);const k=t.tooth;
  for(let i=0;i<t.T.length;i++){const v=t.T[i];let a;if(kind==='kursun')a=clamp(1-(1-v)*k*1.15,0,1);else if(kind==='pastel')a=clamp((v-(.68-.32*k))*3.2,0,1);else if(kind==='tepe')a=clamp((v-.35)*1.6,0,1);else if(kind==='leke'){const x=i%n,y=(i/n)|0;const u=t.T[((y>>2)%n)*n+((x>>2)%n)];a=clamp((u-.25)*1.8,0,1)}else a=clamp((1-v)*1.4-.2,0,1);
    im.data[i*4]=r;im.data[i*4+1]=g;im.data[i*4+2]=b;im.data[i*4+3]=a*255}x.putImageData(im,0,0);const p=ctx.createPattern(c,'repeat');t.cache[key]=p;return p}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
let paperC=null;function buildPaper(){const t=paperTex(D.paper);paperC=mk(PW,PH);const x=paperC.getContext('2d');x.fillStyle=x.createPattern(t.shade,'repeat');x.fillRect(0,0,PW,PH);for(const k in TEX)if(k!==D.paper)TEX[k].cache={}}

/* ===== katmanlar (aydınger) ===== */
function newLayer(name,fog){const c=mk(PW,PH);const L={id:D.seq++,name,vis:true,op:1,fog:!!fog,c,x:c.getContext('2d')};return L}
const LC=new Map();
function layerById(id){return D.layers.find(l=>l.id===id)}
const actL=()=>layerById(D.active)||D.layers[D.layers.length-1];


/* ===== sayfa boyutu ===== */
const SZS=[['A4',2400,1700],['A3',3400,2400],['A2',4800,3400],['Kare',2400,2400],['Geniş',4000,2400]];
const MAXMEM=760e6;
function setPageSize(w,h){PW=w;PH=h;D.pw=w;D.ph=h;SC.width=w;SC.height=h;tmpL.width=w;tmpL.height=h;WGW=Math.ceil(w/WG);WGH=Math.ceil(h/WG);for(const k in WET)delete WET[k];OPC=null;OPX=null;PM=null;PMX=null;paperC=null}
function memOK(w,h,n){return w*h*4*(n+3)<=MAXMEM}
function resizePage(w,h){if(w===PW&&h===PH)return true;if(!memOK(w,h,D.layers.length)){toast('Bu boyut tabletin belleği için fazla büyük. Daha küçük bir kâğıt seç ya da aydınger sayısını azalt.',4200);return false}
  const ox=Math.round((w-PW)/2),oy=Math.round((h-PH)/2);const old=D.layers.map(L=>L.c);setPageSize(w,h);
  D.layers.forEach(L=>{const nc=mk(w,h);nc.getContext('2d').drawImage(L.c,ox,oy);L.c=nc;L.x=nc.getContext('2d');dirty.add(L.id)});old.length=0;
  const g=D.grid;g.hy+=oy;g.v1+=ox;g.v2+=ox;g.c+=ox;g.v3=[g.v3[0]+ox,g.v3[1]+oy];D.symX+=ox;D.crops.forEach(c=>{c.r[0]+=ox;c.r[1]+=oy});showCrop=null;R0=null;RC=null;$('#cropBar').hidden=true;
  H.u=[];H.r=[];updUR();buildPaper();fit();need();saveSoon();return true}
let NEWSZ=null,szSel={k:'A4',port:false};
function szDims(sel){const e=SZS.find(x=>x[0]===sel.k)||SZS[0];let w=e[1],h=e[2];if(sel.port&&w>h)[w,h]=[h,w];return[w,h]}
function szChips(sel,id){return `<div class="chips" id="${id}">${SZS.map(e=>`<button data-sk="${e[0]}" class="${sel.k===e[0]?'on':''}">${e[0]} · ${e[1]}×${e[2]}</button>`).join('')}</div>
  <div class="chips" id="${id}o"><button data-so="0" class="${!sel.port?'on':''}">Yatay</button><button data-so="1" class="${sel.port?'on':''}">Dikey</button></div>`}
function wireSz(root,sel,after){root.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{sel.k=b.dataset.sk;after()});root.querySelectorAll('[data-so]').forEach(b=>b.onclick=()=>{sel.port=b.dataset.so==='1';after()})}
function askSize(cb){const sel={k:szSel.k,port:szSel.port};const m=document.createElement('div');m.className='szm';document.body.appendChild(m);
  const draw=()=>{const[w,h]=szDims(sel);m.innerHTML=`<div class="card"><h3>Yeni sayfa · kâğıt boyutu</h3>${szChips(sel,'szq')}<p>${w} × ${h} px. Kalem boyutları aynı kalır; büyük kâğıtta çizim alanı genişler. A2 gibi büyük kâğıtlar eski tabletlerde yavaşlayabilir.</p><div class="row"><button class="btn" id="szNo">Vazgeç</button><button class="btn primary" id="szOk">Sayfayı aç</button></div></div>`;wireSz(m,sel,draw);
    m.querySelector('#szNo').onclick=()=>m.remove();m.querySelector('#szOk').onclick=()=>{szSel={k:sel.k,port:sel.port};m.remove();cb(w,h)}};draw();m.addEventListener('pointerdown',e=>{if(e.target===m)m.remove()})}

/* ===== görünüm ===== */
const cv=$('#cv'),X=cv.getContext('2d');let VW=1,VH=1,DPR=1;const V={s:.4,tx:0,ty:0};
const p2s=(x,y)=>[V.tx+x*V.s,V.ty+y*V.s];const s2p=(x,y)=>[(x-V.tx)/V.s,(y-V.ty)/V.s];
function size(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);VW=r.width;VH=r.height;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);need()}
function fit(){const m=110;V.s=Math.min((VW-2*m)/PW,(VH-170)/PH);V.tx=(VW-PW*V.s)/2;V.ty=70+(VH-160-PH*V.s)/2;need()}
let rq=0;function need(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
const tmpL=mk(PW,PH),tmpX=tmpL.getContext('2d');
function render(){X.setTransform(DPR,0,0,DPR,0,0);X.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--desk').trim()||'#d9dedb';X.fillRect(0,0,VW,VH);
  X.save();X.translate(V.tx,V.ty);X.scale(V.s,V.s);X.shadowColor='rgba(18,36,31,.22)';X.shadowBlur=24*V.s;X.shadowOffsetY=6*V.s;X.fillStyle='#fff';X.fillRect(0,0,PW,PH);X.shadowColor='transparent';
  X.imageSmoothingEnabled=true;if(!paperC)buildPaper();X.drawImage(paperC,0,0);
  if(D.patOn&&D.pat!=='bos')drawPattern(X);
  D.layers.forEach((L,i)=>{if(!L.vis)return;if(L.fog&&i>0){X.globalAlpha=D.fog*.9;X.fillStyle=D.paper==='kraft'?'#d7bf9c':'#f8f9f6';X.fillRect(0,0,PW,PH);X.globalAlpha=1}
    let src=L.c;if(stroke&&stroke.L===L){previewInto(L);src=tmpL}X.globalAlpha=L.op;X.drawImage(src,0,0);X.globalAlpha=1});
  X.restore();
  if(D.perOn&&D.persp)drawPersp();
  if(D.sym){const[sx]=p2s(D.symX,0);const[,y0]=p2s(0,0),[,y1]=p2s(0,PH);X.strokeStyle='rgba(224,96,60,.7)';X.setLineDash([8,6]);X.lineWidth=1.2;X.beginPath();X.moveTo(sx,y0);X.lineTo(sx,y1);X.stroke();X.setLineDash([])}
  drawCropUI();

  v.innerHTML=`<h3>Ayarlar</h3><label>Servis<select id="sProv"><option value="gemini">Google Gemini</option><option value="openai">OpenAI (GPT Image)</option></select></label>

  g('#sGmM').onchange=e=>LS.set('s_model',e.target.value.trim());g('#sOaM').onchange=e=>LS.set('s_oaModel',e.target.value.trim());g('#sOaQ').onchange=e=>LS.set('s_oaQuality',e.target.value);g('#sOk').onclick=()=>v.hidden=true}
(function(){const o=LS.get('eskiz_ro',null);if(o&&typeof o==='object')RV.o={...RV.o,...o,note:o.note||''}})();

/* ===== kayıt (IndexedDB) ===== */
let dbP=null;function db(){if(dbP)return dbP;dbP=new Promise((res,rej)=>{try{const r=indexedDB.open('eskiz-atolyesi',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbP}
async function dbPut(k,v){try{const d=await db();await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}}
async function dbGet(k){try{const d=await db();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function dbDel(k){try{const d=await db();d.transaction('kv','readwrite').objectStore('kv').delete(k)}catch(e){}}
let svT=0,dirty=new Set();
function saveSoon(){if(stroke)return;const L=actL();if(L)dirty.add(L.id);clearTimeout(svT);svT=setTimeout(saveNow,1200)}
/* Defter: her sayfa ayrı kaydedilir. 'pages' listesi, 'M<sayfa>' sayfa bilgisi, 'P<sayfa>L<katman>' katman resimleri, 'R..'/'S..' renderlar */
const PG={cur:1,seq:2,list:[]};
const LK=id=>'P'+PG.cur+'L'+id;
const pgCur=()=>PG.list.find(p=>p.id===PG.cur);
async function savePages(){await dbPut('pages',JSON.stringify(PG))}
function pageThumb(){const s=360/PW;const c=mk(360,Math.round(PH*s));compose(c.getContext('2d'),0,0,s);return c.toDataURL('image/jpeg',.78)}
let saving=null;
async function saveNow(){if(saving){await saving;}saving=(async()=>{const meta={...D,layers:D.layers.map(l=>({id:l.id,name:l.name,vis:l.vis,op:l.op,fog:l.fog}))};await dbPut('M'+PG.cur,JSON.stringify(meta));
  const ids=[...dirty];dirty.clear();for(const id of ids){const L=layerById(id);if(!L)continue;const blob=await new Promise(r=>L.c.toBlob(r,'image/png'));if(blob)await dbPut(LK(id),blob)}
  const pg=pgCur();if(pg){pg.date=Date.now();try{pg.thumb=pageThumb()}catch(e){}await savePages()}})();await saving;saving=null}
async function load(){const m=await dbGet('M'+PG.cur);if(!m)return false;let o;try{o=JSON.parse(m)}catch(e){return false}if(Array.isArray(o.renders))o.renders.forEach(r=>{if(r.st==='run'){r.st='err';r.err='Render yarıda kaldı.'}});else o.renders=[];if(!o||!Array.isArray(o.layers)||!o.layers.length)return false;
  o.pw=o.pw||2400;o.ph=o.ph||1700;setPageSize(o.pw,o.ph);
  const ls=o.layers;Object.assign(D,o);D.layers=[];for(const l of ls){const L=newLayer(l.name,l.fog);L.id=l.id;Object.assign(L,{vis:l.vis,op:l.op});const b=await dbGet(LK(l.id));if(b){try{const bm=await createImageBitmap(b);L.x.drawImage(bm,0,0)}catch(e){}}D.layers.push(L)}
  D.seq=Math.max(D.seq,...D.layers.map(l=>l.id+1));return true}

/* ===== başlat ===== */
$('#bRender').onclick=()=>{if(RC)return;startCrop()};$('#cropX').onclick=endCrop;$('#cropOk').onclick=confirmCrop;
$('#rvBack').onclick=closeRV;$('#rvRecrop').onclick=()=>{closeRV();startCrop()};$('#rvSetB').onclick=settingsCard;$('#rvRun').onclick=runRender;$('#rvvClose').onclick=()=>$('#rvView').hidden=true;
document.querySelectorAll('#rvN button').forEach(b=>b.onclick=()=>{RV.o.n=+b.dataset.n;saveRO();updRun()});
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bFit').onclick=fit;$('#bPanel').onclick=()=>openPanel($('#panel').hidden);
$('#bSym').onclick=()=>{D.sym=!D.sym;$('#bSym').classList.toggle('on',D.sym);need();saveSoon();if(D.sym)toast('Simetri açık: çizdiğin her şey ortadaki eksene göre aynalanır.',2600)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});
new ResizeObserver(()=>{const first=VW<=1;size();if(first)fit()}).observe(cv);
/* ===== defter görünümü ===== */
const fmtD=t=>new Date(t).toLocaleString('tr-TR',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
async function openBook(){if(RC)endCrop();clearTimeout(svT);await saveNow();$('#df').hidden=false;renderBook()}
function closeBook(){$('#df').hidden=true}
function renderBook(){const g=$('#dfGrid');const L=[...PG.list].sort((a,b)=>b.date-a.date);
  g.innerHTML=`<button class="pc new" id="pgNew"><b>+</b>Yeni sayfa</button>`+L.map(p=>`<div class="pc${p.id===PG.cur?' cur':''}" data-p="${p.id}">
    <button class="th" data-open="${p.id}" aria-label="${esc(p.name)} sayfasını aç">${p.thumb?`<img alt="" src="${p.thumb}">`:''}</button>
    <div class="nm"><input value="${esc(p.name)}" data-nm="${p.id}" aria-label="Sayfa adı" maxlength="60"></div><div class="dt">${fmtD(p.date)}${p.id===PG.cur?' · açık':''}</div>
    <div class="row"><button class="btn" data-dup="${p.id}">Çoğalt</button><button class="btn" data-png="${p.id}">PNG</button><button class="btn del" data-del="${p.id}">Sil</button></div></div>`).join('');
  $('#dfNote').textContent=PG.list.length+' sayfa. Çizimler bu tablette, bu tarayıcının içinde saklanır. Tarayıcı verisini silersen ya da tablet değişirse kaybolmaması için ara ara “Yedek al” de; dosyayı Drive’a koyabilirsin.';
  $('#pgNew').onclick=()=>askSize(async(w,h)=>{const id=PG.seq++;PG.list.push({id,name:'Sayfa '+id,date:Date.now()});NEWSZ=[w,h];if(await openPage(id))closeBook();else PG.list=PG.list.filter(p=>p.id!==id);NEWSZ=null});
  g.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{const id=+b.dataset.open;if(id===PG.cur){closeBook();return}if(await openPage(id))closeBook()});
  g.querySelectorAll('[data-nm]').forEach(i=>i.onchange=()=>{const p=PG.list.find(x=>x.id===+i.dataset.nm);if(!p)return;p.name=i.value.trim()||p.name;i.value=p.name;savePages();if(p.id===PG.cur)$('#pgName').textContent=p.name});
  g.querySelectorAll('[data-dup]').forEach(b=>b.onclick=async()=>{const src=PG.list.find(x=>x.id===+b.dataset.dup);const id=PG.seq++;const m=await dbGet('M'+src.id);
    if(m){const o=JSON.parse(m);for(const l of o.layers||[]){const bl=await dbGet('P'+src.id+'L'+l.id);if(bl)await dbPut('P'+id+'L'+l.id,bl)}o.renders=[];await dbPut('M'+id,JSON.stringify(o))}
    PG.list.push({id,name:src.name+' (kopya)',date:Date.now(),thumb:src.thumb});await savePages();renderBook();toast('Sayfa çoğaltıldı. Renderlar kopyalanmadı.',2200)});
  g.querySelectorAll('[data-png]').forEach(b=>b.onclick=()=>exportPagePNG(+b.dataset.png));
  g.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Silinsin mi?';setTimeout(()=>{b.dataset.arm='';b.textContent='Sil'},3000);return}
    const id=+b.dataset.del;if(id===PG.cur&&RV.busy){toast('Render bitince silebilirsin.',2000);return}await deletePageData(id);PG.list=PG.list.filter(p=>p.id!==id);
    if(!PG.list.length){const nid=PG.seq++;PG.list.push({id:nid,name:'Sayfa '+nid,date:Date.now()})}
    if(id===PG.cur){D.layers=[];PG.cur=-1;await openPage(PG.list[0].id)}else await savePages();renderBook()})}
async function deletePageData(id){const m=await dbGet('M'+id);if(m){try{const o=JSON.parse(m);for(const l of o.layers||[])dbDel('P'+id+'L'+l.id);const sk=new Set();for(const r of o.renders||[]){dbDel('R'+r.id);if(r.srcK)sk.add(r.srcK)}sk.forEach(k=>dbDel(k))}catch(e){}}dbDel('M'+id)}
/* sayfanın tam çözünürlüklü görseli: kayıtlı katmanlardan yeniden kurulur, açık sayfa ise doğrudan çizilir */
async function pageCanvas(id){if(id===PG.cur){const c=mk(PW,PH);compose(c.getContext('2d'),0,0,1);return c}
  const m=await dbGet('M'+id);if(!m)return mk(PW,PH);const o=JSON.parse(m);const W=o.pw||2400,H2=o.ph||1700;const c=mk(W,H2),x=c.getContext('2d');const t=paperTex(o.paper||'eskiz');x.fillStyle=x.createPattern(t.shade,'repeat');x.fillRect(0,0,W,H2);
  for(let i=0;i<o.layers.length;i++){const l=o.layers[i];if(!l.vis)continue;if(l.fog&&i>0){x.globalAlpha=(o.fog??.5)*.9;x.fillStyle=o.paper==='kraft'?'#d7bf9c':'#f8f9f6';x.fillRect(0,0,W,H2)}
    const b=await dbGet('P'+id+'L'+l.id);if(b){try{const bm=await createImageBitmap(b);x.globalAlpha=l.op;x.drawImage(bm,0,0)}catch(e){}}x.globalAlpha=1}return c}
const fname=(id,ext)=>{const p=PG.list.find(x=>x.id===id);return(p?p.name:'eskiz').replace(/[\\/:*?"<>|]+/g,'-').trim()+'.'+ext};
function dlBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function exportPagePNG(id,type='image/png'){const c=await pageCanvas(id);const b=await new Promise(r=>c.toBlob(r,type,.92));if(b){dlBlob(b,fname(id,type==='image/png'?'png':'jpg'));toast('İndirilenler klasörüne kaydedildi.',2200)}}
async function sharePage(){const c=await pageCanvas(PG.cur);const b=await new Promise(r=>c.toBlob(r,'image/png'));const f=new File([b],fname(PG.cur,'png'),{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:f.name});return}}catch(e){if(e.name==='AbortError')return}dlBlob(b,f.name);toast('Paylaşma desteklenmiyor; dosya indirildi.',2400)}
/* ===== yedek ===== */
const b2u=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)});
async function u2b(u){return await (await fetch(u)).blob()}
async function exportBackup(){clearTimeout(svT);await saveNow();toast('Yedek hazırlanıyor…',8000);const out={app:'eskiz-defteri',v:1,date:Date.now(),pages:[]};
  for(const p of PG.list){const m=await dbGet('M'+p.id);if(!m)continue;const o=JSON.parse(m);const pg={name:p.name,date:p.date,thumb:p.thumb||'',meta:m,layers:{},renders:{},srcs:{}};
    for(const l of o.layers||[]){const b=await dbGet('P'+p.id+'L'+l.id);if(b)pg.layers[l.id]=await b2u(b)}
    for(const r of o.renders||[]){const u=await dbGet('R'+r.id);if(u)pg.renders[r.id]=u;if(r.srcK&&!pg.srcs[r.srcK]){const su=await dbGet(r.srcK);if(su)pg.srcs[r.srcK]=su}}out.pages.push(pg)}
  const d=new Date(),z=n=>String(n).padStart(2,'0');dlBlob(new Blob([JSON.stringify(out)],{type:'application/json'}),`eskiz-defteri-yedek-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}.json`);toast(out.pages.length+' sayfa yedeklendi (İndirilenler).',3000)}
async function importBackup(file){let o;try{o=JSON.parse(await file.text())}catch(e){toast('Bu dosya okunamadı.',2400);return}if(!o||o.app!=='eskiz-defteri'||!Array.isArray(o.pages)){toast('Bu bir Eskiz Defteri yedeği değil.',2600);return}
  toast('Yedek yükleniyor…',8000);let n=0;for(const pg of o.pages){try{const id=PG.seq++;const m=JSON.parse(pg.meta);
    for(const k in pg.layers){await dbPut('P'+id+'L'+k,await u2b(pg.layers[k]))}
    const sMap={};for(const k in pg.srcs){const nk='S'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);sMap[k]=nk;await dbPut(nk,pg.srcs[k])}
    for(const r of m.renders||[]){const old=r.id;r.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);if(pg.renders[old])await dbPut('R'+r.id,pg.renders[old]);if(r.srcK)r.srcK=sMap[r.srcK]||null}
    await dbPut('M'+id,JSON.stringify(m));PG.list.push({id,name:pg.name||('Sayfa '+id),date:pg.date||Date.now(),thumb:pg.thumb||''});n++}catch(e){}}
  await savePages();renderBook();toast(n+' sayfa deftere eklendi.',2600)}
/* ===== kaydet menüsü ===== */
function toggleSave(){const p=$('#savePop');if(!p.hidden){p.hidden=true;return}p.hidden=false;const b=$('#bSave').getBoundingClientRect();p.style.top=(b.bottom+8)+'px';p.style.left=clamp(b.right-p.offsetWidth,8,innerWidth-p.offsetWidth-8)+'px'}
$('#bSave').onclick=e=>{e.stopPropagation();toggleSave()};document.addEventListener('pointerdown',e=>{const p=$('#savePop');if(!p.hidden&&!p.contains(e.target)&&e.target!==$('#bSave')&&!$('#bSave').contains(e.target))p.hidden=true});
$('#svPng').onclick=()=>{$('#savePop').hidden=true;exportPagePNG(PG.cur)};$('#svJpg').onclick=()=>{$('#savePop').hidden=true;exportPagePNG(PG.cur,'image/jpeg')};$('#svShare').onclick=()=>{$('#savePop').hidden=true;sharePage()};
$('#bBook').onclick=openBook;$('#dfBack').onclick=closeBook;$('#dfExp').onclick=exportBackup;$('#dfImp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importBackup(f)};
/* ===== tablet ===== */
let wake=null;async function keepAwake(){try{if('wakeLock'in navigator&&!wake&&document.visibilityState==='visible'){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}
document.addEventListener('pointerdown',keepAwake,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(svT);saveNow()}else keepAwake()});
window.addEventListener('pagehide',()=>{clearTimeout(svT);saveNow()});
document.addEventListener('contextmenu',e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault()});
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.hostname))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const D0=JSON.parse(JSON.stringify(D));
const GLOB=['sizes','ops','color','tool','erMode','mkTip','mkAng','mine','recent','wob','hold','snapA','autoLine','ruler'];
function applyUI(){buildPaper();fit();updLn();renderRail();setTool(D.tool);renderPal();updUR();$('#bSym').classList.toggle('on',D.sym);renderPanel();need();const pg=pgCur();$('#pgName').textContent=pg?pg.name:''}
function blankPage(){const keep={};GLOB.forEach(k=>keep[k]=JSON.parse(JSON.stringify(D[k])));const paper={paper:D.paper,pat:D.pat,patOn:D.patOn,patOp:D.patOp};
  D=Object.assign(JSON.parse(JSON.stringify(D0)),keep,paper);const[nw,nh]=NEWSZ||[2400,1700];NEWSZ=null;setPageSize(nw,nh);D.grid={hy:nh*.44,v1:-nw*.55,v2:nw*1.55,c:nw/2,v3:[nw/2,nh*2.7]};D.symX=nw/2;const L=newLayer('Taslak',false);D.layers=[L];D.active=L.id;dirty.add(L.id)}
async function openPage(id){if(RV.busy){toast('Render bitince sayfa değiştirebilirsin.',2400);return false}clearTimeout(svT);if(D.layers.length)await saveNow();
  PG.cur=id;await savePages();const keep={};GLOB.forEach(k=>keep[k]=D[k]);H.u=[];H.r=[];for(const k in WET)delete WET[k];showCrop=null;R0=null;RV.src=null;
  const ok=await load();if(ok)Object.assign(D,keep);else blankPage();applyUI();if(!ok)saveSoon();return true}
async function boot(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  const pj=await dbGet('pages');let first=false;
  if(pj){try{Object.assign(PG,JSON.parse(pj))}catch(e){}}
  if(!PG.list.length){first=true;PG.list=[{id:1,name:'Sayfa 1',date:Date.now()}];PG.cur=1;PG.seq=2;
    const old=await dbGet('meta');if(old){/* eski tek sayfalık kaydı ilk sayfaya taşı */await dbPut('M1',old);try{for(const l of JSON.parse(old).layers||[]){const b=await dbGet('L'+l.id);if(b)await dbPut('P1L'+l.id,b)}}catch(e){}first=false}
    await savePages()}
  if(!pgCur())PG.cur=PG.list[0].id;
  const ok=await load();if(!ok){const L=newLayer('Taslak',false);D.layers=[L];D.active=L.id;dirty.add(L.id)}
  size();applyUI();if(!ok)saveSoon();
  if(first)toast('Kalemle çiz, iki parmakla kaydır ve yakınlaş. Kâğıt, ızgara ve aydınger Panel\'de. Sayfaların Defter\'de.',5200)}
boot();
